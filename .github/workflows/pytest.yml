name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --------------------------------------------------------------------------
  # Fast feedback for every PR: dataProcess + imports only. Skips the
  # rawDataReader fixtures (the slow part of the suite).
  #
  # Only the two ends of the supported range run here. The versions in
  # between are not abandoned — `wheels.yml` runs CIBW_TEST_COMMAND (import
  # + the Fortran extension) on cp310-cp314 for every release, so "does it
  # install and import" is gated on all five before anything reaches PyPI.
  # What this job adds on top of that is the dataProcess maths, and that is
  # pure numpy/pandas: it breaks at the ends (oldest/newest resolvable
  # dependency set), not in the middle.
  # --------------------------------------------------------------------------
  quick:
    name: quick (dataProcess) py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.14" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install
        # Non-editable install: pip builds the wheel once, installs it,
        # and the test run uses the installed package. Avoids
        # meson-python's editable-rebuild-on-import path (which needs
        # ninja in the runtime env after the build-isolation env is
        # cleaned up).
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run tests
        run: |
          pytest tests/test_imports.py tests/test_dataprocess/ \
            --cov=AeroViz \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-quick-py${{ matrix.python-version }}-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Full reader pipeline — the bulk of the suite, and the slow part.
  #
  # Two jobs, each pinned to one *corner* of the supported space rather than
  # to a version picked for being popular:
  #
  #   py3.10 + pandas 2.2  -> both declared floors at once
  #   py3.14 + pandas 3.x  -> both ceilings at once
  #
  # `pandas>=2.2.0` in pyproject is a claim, and pip only ever resolves the
  # newest, so the floor went untested — until a test that keyed on
  # `dtype == object` passed on 2.2 and failed on 3.0, where string columns
  # became `str`. Pinning the floor onto the oldest Python folds that check
  # into a job that had to exist anyway: pandas 3.0 requires >=3.11, so 3.10
  # is where a pandas-2 environment is the honest one to test.
  # --------------------------------------------------------------------------
  readers:
    name: readers py${{ matrix.python-version }} (pandas${{ matrix.pandas || ' latest' }})
    needs: quick
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pandas: "==2.2.*"
          - python-version: "3.14"
            pandas: ""
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install
        # Non-editable install: pip builds the wheel once, installs it,
        # and the test run uses the installed package. Avoids
        # meson-python's editable-rebuild-on-import path (which needs
        # ninja in the runtime env after the build-isolation env is
        # cleaned up).
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          if [ -n "${{ matrix.pandas }}" ]; then
            pip install "pandas${{ matrix.pandas }}"
          fi
          python -c "import pandas; print('pandas', pandas.__version__)"
      - name: Run reader tests
        run: |
          pytest tests/test_readers/ -m "not requires_data" \
            --cov=AeroViz \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-readers-py${{ matrix.python-version }}-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
