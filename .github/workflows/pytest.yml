name: Python Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # --------------------------------------------------------------------------
  # Fast feedback for every PR: dataProcess + imports only. Skips the
  # rawDataReader fixtures (the slow part of the suite).
  #
  # Only the two ends of the supported range run here. The versions in
  # between are not abandoned — `wheels.yml` runs CIBW_TEST_COMMAND (import
  # + the Fortran extension) on cp310-cp314 for every release, so "does it
  # install and import" is gated on all five before anything reaches PyPI.
  # What this job adds on top of that is the dataProcess maths, and that is
  # pure numpy/pandas: it breaks at the ends (oldest/newest resolvable
  # dependency set), not in the middle.
  # --------------------------------------------------------------------------
  quick:
    name: quick (dataProcess) py${{ matrix.python-version }}${{ matrix.floors && ' [floors]' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            floors: true
          - python-version: "3.14"
            floors: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Pin every dependency to its declared floor
        if: matrix.floors
        run: |
          python .github/scripts/floor_constraints.py > floors.txt
          cat floors.txt
      - name: Install
        # Non-editable install: pip builds the wheel once, installs it,
        # and the test run uses the installed package. Avoids
        # meson-python's editable-rebuild-on-import path (which needs
        # ninja in the runtime env after the build-isolation env is
        # cleaned up).
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" ${{ matrix.floors && '-c floors.txt' || '' }}
          pip list | grep -iE '^(pandas|numpy|matplotlib|scipy|numba|plotly|cartopy|scikit-learn) '
      - name: Run tests
        run: |
          pytest tests/test_imports.py tests/test_dataprocess/ \
            --cov=AeroViz \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-quick-py${{ matrix.python-version }}-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # Full reader pipeline — the bulk of the suite, and the slow part.
  #
  # Two jobs, each pinned to one *corner* of the supported space rather than
  # to a version picked for being popular:
  #
  #   py3.10, every dependency at its declared floor  -> the whole lower corner
  #   py3.14, everything newest                       -> the whole upper corner
  #
  # Every `>=` in pyproject is a claim, and pip only ever resolves the newest
  # match, so floors are the versions that never get installed. Two of these
  # claims had already gone bad by the time anyone looked: a test keyed on
  # `dtype == object` passed on pandas 2.2 and failed on 3.0 (string columns
  # became `str`), and `pandas>=2.2.0` was flatly unsatisfiable next to
  # `numpy>=2.0.0`, because pandas capped `numpy<2` until 2.2.2 — nobody could
  # install the combination the metadata advertised.
  #
  # So the floor job pins *all* of them, not just pandas, via constraints
  # generated from pyproject itself. Generated rather than committed so the
  # two cannot drift: change a floor, and this job tests the new one. 3.10 is
  # the honest place for it, since pandas 3 requires >=3.11.
  # --------------------------------------------------------------------------
  readers:
    name: readers py${{ matrix.python-version }}${{ matrix.floors && ' [floors]' || '' }}
    needs: quick
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            floors: true
          - python-version: "3.14"
            floors: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Pin every dependency to its declared floor
        if: matrix.floors
        run: |
          python .github/scripts/floor_constraints.py > floors.txt
          cat floors.txt
      - name: Install
        # Non-editable install: pip builds the wheel once, installs it,
        # and the test run uses the installed package. Avoids
        # meson-python's editable-rebuild-on-import path (which needs
        # ninja in the runtime env after the build-isolation env is
        # cleaned up).
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" ${{ matrix.floors && '-c floors.txt' || '' }}
          pip list | grep -iE '^(pandas|numpy|matplotlib|scipy|numba|plotly|cartopy|scikit-learn) '
      - name: Run reader tests
        run: |
          pytest tests/test_readers/ -m "not requires_data" \
            --cov=AeroViz \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-readers-py${{ matrix.python-version }}-${{ github.sha }}
          path: coverage.xml
          if-no-files-found: error
